<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/super-hands@^3.0.4/dist/super-hands.min.js"></script>

  <script type="module">
    import { read_audio } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    window.read_audio = read_audio;
    //window.pipeline = pipeline
  </script>
</head>
<body>
  <a-scene>
    <!-- Textarea for Speech Output -->
    <a-entity
      id="textArea"
      geometry="primitive: plane; width: 2; height: 1"
      material="color: #AAA"
      position="0 1.6 -3"
      text="value: What Would You Like to See in 3D?: "
      visible="false">
    </a-entity>

    <!-- Button for Starting/Stopping Speech Input -->
    <a-plane
      id="startButton"
      class="clickable"
      color="cyan"box
      width="1"
      height="0.5"
      position="1.6 1.5 -3"
      text="value: Start Speech Input">
    </a-plane>

    <a-entity cursor="rayOrigin: mouse"></a-entity>
    <a-plane static-body rotation="-90 0 0" color="#27ae60" scale="25 25 25" ></a-plane>
    <a-sky color="#3498db"></a-sky>
    <a-entity id="player">
      <a-camera id="head" wasd-controls look-controls-enabled keyboard-controls="mode: fps"></a-camera>
      <!-- Controller Entities (MODIFIED) -->
      <!-- The sphere-collider now targets any object with the 'grabbable' class -->
      <a-entity hand-controls="hand: left" laser-controls="hand: left" raycaster="objects: .clickable" sphere-collider="objects: .grabbable" super-hands></a-entity>
      <a-entity hand-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable" sphere-collider="objects: .grabbable" super-hands></a-entity>
    </a-entity>

    <!-- This box is now also a grabbable object for consistency -->
    <a-box class="grabbable" hoverable grabbable stretchable draggable droppable color="blue" position="0 0 -1"></a-box>

    <a-light type="ambient" color="#888"></a-light>
    <a-light type="directional" color="#fff" intensity="0.5" position="0 1 1"></a-light>
  </a-scene>

  <script id="worker1" type="javascript/worker">
    import { pipeline, read_audio } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
  
    self.pipeline = pipeline;

    self.onmessage = async function(event) {
      const audioFloat = event.data.floater;
    
      console.log(audioFloat)
    
      // Use the new transcriber API
      const transcriber = await self.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');
      const output = await transcriber(audioFloat);
    
      // Post the transcription result back to the main thread
      self.postMessage({ text: output.text });
    };
  </script>
  
  <script>
    var blob = new Blob([
        document.querySelector('#worker1').textContent
      ], { type: "text/javascript" })

    var worker = new Worker(window.URL.createObjectURL(blob), { type: "module" });

    let isRecording = false;
    let recognizedText = '';
    let mediaRecorder = null;
    let audioChunks = [];

    document.getElementById('startButton').addEventListener('click', async function () {
      const textArea = document.getElementById('textArea');
      textArea.setAttribute('visible', true);

      if (!isRecording) {
        try {
          const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(audioStream);
          audioChunks = [];
          mediaRecorder.ondataavailable = event => {
            audioChunks.push(event.data);
          };
          mediaRecorder.start();
          console.log('Recording started');
          isRecording = true;
          const button = document.getElementById('startButton');
          button.setAttribute('color', 'red');
          button.setAttribute('text', 'value', 'Stop Speech Input');
        } catch (error) {
          console.error('Error accessing microphone:', error);
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.onstop = () => {
          console.log('Recording stopped, processing...');
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          const url = URL.createObjectURL(audioBlob);

          read_audio(url, 16000)
            .then(floater => {
              worker.postMessage({ floater });
              worker.onmessage = function(event) {
                const output = event.data;
                recognizedText = output.text;
                console.log('Recognized speech:', recognizedText);
                textArea.setAttribute('text', 'value', 'What Would You Like to See in 3D?: ' + recognizedText);
                loadModel(recognizedText);
                // The original addBoxToScene() call is removed from here as it's now called inside loadModel
                URL.revokeObjectURL(url);
              };
              worker.onerror = function(error) {
                console.error('There was a problem with the worker:', error);
              };
            })
            .catch(error => {
              console.error('There was a problem with reading the audio:', error);
            });

          isRecording = false;
          const button = document.getElementById('startButton');
          button.setAttribute('color', 'green');
          button.setAttribute('text', 'value', 'Start Speech Input');
        };
      }
    });

    function loadModel(description) {
      const url = `http://localhost:5000/model?description=${encodeURIComponent(description)}`;
      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok ' + response.statusText);
          }
          return response.blob();
        })
        .then(blob => {
          const blobUrl = URL.createObjectURL(blob);
          const modelEntity = addModelToScene(blobUrl);
          // Pass the created model entity to the function that wraps it in a manipulable sphere
          addBoxToScene(modelEntity);
        })
        .catch(error => {
          console.error('There was a problem with the fetch operation:', error);
        });
    }

    function addModelToScene(blobUrl) {
      const newEntity = document.createElement('a-entity');
      newEntity.setAttribute('obj-model', `obj: ${blobUrl}`);
      newEntity.setAttribute('position', '0 0 0');
      return newEntity;
    }

    // MODIFIED: This function now creates a fully interactive sphere
    function addBoxToScene(modelEntity) {
      const sceneEl = document.querySelector('a-scene');
      const newBoxEntity = document.createElement('a-sphere');
      
      // Set position and make it invisible (it's just a container)
      newBoxEntity.setAttribute('position', getRandomPosition());
      newBoxEntity.setAttribute('opacity', '0.0');

      // Add classes for raycaster (clicking) and super-hands (grabbing)
      newBoxEntity.setAttribute('class', 'clickable grabbable');
      
      // Add super-hands interaction attributes
      newBoxEntity.setAttribute('hoverable', '');
      newBoxEntity.setAttribute('grabbable', '');
      newBoxEntity.setAttribute('stretchable', '');
      newBoxEntity.setAttribute('draggable', '');
      
      // Add the 3D model inside the interactive sphere
      newBoxEntity.appendChild(modelEntity);
      sceneEl.appendChild(newBoxEntity);
      sceneEl.flushToDOM();

      // Add physics body after the entity has been loaded into the scene
      newBoxEntity.addEventListener('loaded', () => {
        console.log('Entity loaded and ready for manipulation');
        newBoxEntity.setAttribute('dynamic-body', '');
        if (newBoxEntity.components['dynamic-body']) {
            newBoxEntity.components['dynamic-body'].initComponent();
        }
      });
    }

    function getRandomPosition() {
      return `${Math.random() * 4 - 2} 3 ${Math.random() * 4 - 2}`;
    }

    // The debug code remains unchanged as it handles mouse-based dragging
    document.addEventListener('DOMContentLoaded', function () {
      const sceneEl = document.querySelector('a-scene');
      const clickableEls = document.querySelectorAll('.clickable');
      let currentDraggedEl = null;
      let textBox = document.createElement('a-box');

      function createBox(event, textinBox) {
        const clickedEl = event.target;
        const sceneEl = document.querySelector('a-scene');
        sceneEl.remove(textBox);
        const newBox = document.createElement('a-sphere');
        newBox.setAttribute('position', {x: 0, y: 1, z: -5});
        newBox.setAttribute('color', '#FFC65D');
        newBox.setAttribute('scale', {x: 2, y: 2, z: 2});
        const text = document.createElement('a-text');
        text.setAttribute('value', ` ${textinBox}`);
        text.setAttribute('color', '#000');
        text.setAttribute('position', {x: -1, y: 0, z: 0.5});
        text.setAttribute('scale', {x: 4, y: 4, z: 4});
        newBox.appendChild(text);
        textBox = newBox;
        sceneEl.appendChild(textBox);
      }

      function startDrag(evt) {
        currentDraggedEl = evt.currentTarget;
        currentDraggedEl.classList.add('dragging');
      }

      function doDrag(evt) {
        if (currentDraggedEl && currentDraggedEl.classList.contains('dragging')) {
          const cursorEl = document.querySelector('a-cursor');
          const intersection = cursorEl.components.raycaster.getIntersection(currentDraggedEl);
          if (intersection) {
            const point = intersection.point;
            currentDraggedEl.setAttribute('position', { x: point.x, y: point.y, z: currentDraggedEl.getAttribute('position').z });
          }
        }
      }

      function endDrag(evt) {
        if (currentDraggedEl) {
          currentDraggedEl.classList.remove('dragging');
          currentDraggedEl = null;
        }
      }

      clickableEls.forEach(el => {
        el.addEventListener('mousedown', startDrag);
      });

      sceneEl.addEventListener('mousemove', doDrag);
      sceneEl.addEventListener('mouseup', endDrag);
    });
  </script>
</body>
</html>
