kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vr-ai-world-gpu
nodes:
- role: control-plane
  image: kindest/node:v1.31.0
  extraPortMappings:
  - containerPort: 30000
    hostPort: 3000
    protocol: TCP
  - containerPort: 30001  
    hostPort: 8000
    protocol: TCP
- role: worker
  image: kindest/node:v1.31.0
  labels:
    accelerator: nvidia-tesla-gpu
