apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: vr-ai-world
  labels:
    app: inference-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      containers:
      - name: inference
        image: vr-ai-world/inference:latest
        imagePullPolicy: Never  # For local development
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      nodeSelector:
        accelerator: nvidia-tesla-gpu  # Ensure pods are scheduled on GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: vr-ai-world
  labels:
    app: inference-service
spec:
  selector:
    app: inference-service
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP