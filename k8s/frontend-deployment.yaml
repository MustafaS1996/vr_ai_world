apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: vr-ai-world
  labels:
    app: frontend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
      - name: frontend
        image: vr-ai-world/frontend:latest
        imagePullPolicy: Never  # For local development
        ports:
        - containerPort: 3000
        env:
        - name: INFERENCE_SERVICE_URL
          value: "http://inference-service:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
      nodeSelector:
        kubernetes.io/arch: amd64  # Can run on any CPU node
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: vr-ai-world
  labels:
    app: frontend-service
spec:
  selector:
    app: frontend-service
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: LoadBalancer  # Expose to external traffic