apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vr-ai-world-ingress
  namespace: vr-ai-world
  annotations:
    kubernetes.io/ingress.global-static-ip-name: vr-ai-world-ip
    networking.gke.io/managed-certificates: vr-ai-world-ssl
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
  - host: vr-ai-world.34.102.148.110.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: vr-ai-world-ssl
  namespace: vr-ai-world
spec:
  domains:
    - vr-ai-world.34.102.148.110.nip.io